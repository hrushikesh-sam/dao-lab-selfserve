# .github/workflows/ci.yml — the test suite on every push and pull request (B-101, mistakes.md K6).
# Installs the `ansible` extra so tests/test_playbooks.py and tests/test_ansible_runner.py run the
# real playbooks against the fake lab (tests/fakelab.py); nothing here touches real hardware.
name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    # The controller floor is Python 3.12 (F-5-3, B-103). 3.12 and 3.13 are the design's
    # CI pair; ansible-core 2.20+ also supports 3.14, which isn't tested here.
    # fail-fast is off so one version's failure doesn't hide the other's result.
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[ansible]"
          ansible-playbook --version
      - name: Test
        run: python -m pytest tests/ -q -rf
