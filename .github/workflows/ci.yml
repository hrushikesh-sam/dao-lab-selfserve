# .github/workflows/ci.yml — the test suite on every push and pull request (B-101, mistakes.md K6).
# Installs the `ansible` extra so tests/test_playbooks.py and tests/test_ansible_runner.py run the
# real playbooks against the fake lab (tests/fakelab.py); nothing here touches real hardware.
name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[ansible]"
          ansible-playbook --version
      - name: Test
        run: python -m pytest tests/ -q -rf
