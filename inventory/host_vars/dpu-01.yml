# inventory/host_vars/dpu-01.yml — the CN10K board xeon3-oct-112 (B-85 bring-up).
#
# Filled from `lspci -D`, /sys/bus/platform/devices and
# /sys/bus/pci/devices/*/sriov_numvfs (Phase 1, B-85).
# Board `xeon3-oct-112`, Ubuntu 22.04.5 aarch64, nproc=24, mgmt eth5 10.68.0.190 (login `dao-test`).
# bdf.cpt_vfs is bound to vfio-pci and sized to nproc; bdf.sdp_pf is the OCTEON SDP admin function
# whose VFs (a0f7, rvu_nicvf) the board exposes to dpu-01-xcp for smartnic/VPP.
#
# The VPP / SmartNIC runbooks take their PCI addresses, ports and paths from their own values in
# VPP_ansible/group_vars/all.yml and dao-smartnic/.../group_vars/all.yml. The bdf map below is a
# record of what the board exposes.

# The EBF personality the board runs. playbooks/bringup.yml writes it to /etc/daolab/hw_class
# once; from then on a deploy whose use case needs another personality stops with the manual
# flash message (roles/ebf_set) instead of running on the wrong one.
hw_class: sdp-pf1-vf8              # Phase-1 bootstrap ONLY; resources.hw_class in the DB is
                                   # the source of truth after the first provision

# The operator account the runbooks run as must sudo without a password (their become: true
# steps run unattended from the dashboard). If it cannot, set ansible_become_password here
# through ansible-vault, never in plain text.

bdf:
  sdp_pf: "0002:01:00.0"           # device a065, drv rvu_af; 9 VFs 0002:01:00.1–0002:01:01.1 (a0f7)
  cpt_pf: "0002:20:00.0"           # device a0f2, drv rvu_cptpf; sriov_totalvfs=64, numvfs=24
  cpt_vfs:                         # device a0f3, drv vfio-pci; 24 = nproc = 24
    - "0002:20:00.1"
    - "0002:20:00.2"
    - "0002:20:00.3"
    - "0002:20:00.4"
    - "0002:20:00.5"
    - "0002:20:00.6"
    - "0002:20:00.7"
    - "0002:20:01.0"
    - "0002:20:01.1"
    - "0002:20:01.2"
    - "0002:20:01.3"
    - "0002:20:01.4"
    - "0002:20:01.5"
    - "0002:20:01.6"
    - "0002:20:01.7"
    - "0002:20:02.0"
    - "0002:20:02.1"
    - "0002:20:02.2"
    - "0002:20:02.3"
    - "0002:20:02.4"
    - "0002:20:02.5"
    - "0002:20:02.6"
    - "0002:20:02.7"
    - "0002:20:03.0"

# ml-tvm (playbooks/apps/ml-tvm/): the MLIP, confirmed on this board on 2026-11-18.
# ML PF 177d:a092. The PEM is 0001:00:10.0 - one digit away; never confuse them.
ml_pci: "0000:00:10.0"
ml_fw: /lib/firmware/mlip-fw.bin                  # mlip-fw-0.1.24.11-7f268f876
# Cores for dpdk-test-mldev: nginx-tls's worker is pinned to core 12 (its DPDK helper threads
# float on the rest but sleep); VPP uses 4-6 when it runs. 14-17 had no pinned work.
ml_lcores: "14-17"
ml_file_prefix: ml                                 # DPDK files; nginx-tls uses e_cpt_engine<pid>
# Hugepages: the default size here is 512 MB and nginx-tls holds 2 of them; ml-tvm adds 2.
ml_hugepage_kb: 524288
ml_hugepages_extra: 2
# The smoke model and its reference output ship with the SDK under /lib/firmware/ml_models.
ml_smoke_dir: /lib/firmware/ml_models/resnet50_fp16_t08_b01
ml_smoke_model: resnet50_fp16_t08_b01
ml_state_dir: /var/lib/daolab/ml
