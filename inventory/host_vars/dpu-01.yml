# inventory/host_vars/dpu-01.yml — filled from `lspci -D`, /sys/bus/platform/devices and
# /sys/bus/pci/devices/*/sriov_numvfs (Phase 1, B-85).
# Board `xeon3-oct-112`, Ubuntu 22.04.5 aarch64, nproc=24, mgmt eth5 10.68.0.190 (login `dao-test`).
# bdf.cpt_vfs is bound to vfio-pci and sized to nproc; bdf.sdp_pf is the OCTEON SDP admin function
# whose VFs (a0f7, rvu_nicvf) the board exposes to dpu-01-xcp for smartnic/VPP.
hw_class: sdp-pf1-vf8              # Phase-1 bootstrap ONLY; resources.hw_class in the DB is
                                   # the source of truth after the first provision
bdf:
  sdp_pf: "0002:01:00.0"           # device a065, drv rvu_af; 9 VFs 0002:01:00.1–0002:01:01.1 (a0f7)
  cpt_pf: "0002:20:00.0"           # device a0f2, drv rvu_cptpf; sriov_totalvfs=64, numvfs=24
  cpt_vfs:                         # device a0f3, drv vfio-pci; 24 = nproc = 24
