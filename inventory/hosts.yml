# Ansible inventory — hosts referenced by setups/*.yml members and the playbooks.
# Testbed tb-01: two XCP-ng dom0s (E810 side + SDP side) plus the OCTEON DPU board.
# host_vars/ (PCI BDFs, VF lists, storage SRs) are filled during Phase 1.
all:
  children:
    xcp_hosts:
      vars:
        ansible_user: root
        ansible_python_interpreter: /usr/bin/python3
      hosts:
        tg-01-xcp:                 # xcp-ng-fxbqndvl — E810-C, 7 VFs in pciback
          ansible_host: 10.68.0.52
        dpu-01-xcp:
          ansible_host: 10.68.0.53  # DAO-Agentic-Infra — OCTEON SDP endpoint 0000:6f:00.0
    dpus:
      hosts:
        dpu-01:
          ansible_host: 10.68.0.190
          ansible_user: dao-test
          ansible_become: true
