# Ansible inventory — hosts referenced by setups/*.yml members and the playbooks.
# Testbed tb-01: two XCP-ng dom0s (E810 side + SDP side) plus the OCTEON DPU board.
#
# DPUs are static: dpu-01 is the CN10K board xeon3-oct-112 (CRB106) at its fixed management
# address, reached as dao-test, the account the VPP / SmartNIC runbooks (VPP_ansible/,
# dao-smartnic/) were run with; it needs passwordless sudo for their `become: true` steps.
# Users never get dao-test: deploys give them the `lab` login (playbooks/roles/dpu_access).
#
# VMs get their management addresses from DAOLAB_IP_POOL (10.68.1.0-10.68.2.200).
# host_vars/ (PCI BDFs, VF lists, storage SRs) are filled at testbed bring-up (Phase 1, B-85).
all:
  children:
    xcp_hosts:
      # B-93: daolab never logs in to a dom0. Every VM operation is a Xen Orchestra REST call
      # made from the control node (service/xo.py), so these hosts are local connections; their
      # host_vars name the XO pool, the templates and the SR-IOV networks.
      vars:
        ansible_connection: local
        ansible_python_interpreter: "{{ ansible_playbook_python }}"
      hosts:
        tg-01-xcp:                 # xcp-ng-fxbqndvl — E810-C, 7 VFs in pciback
          ansible_host: 10.68.0.52
        dpu-01-xcp:
          ansible_host: 10.68.0.53  # DAO-Agentic-Infra — OCTEON SDP endpoint 0000:6f:00.0
    dpus:
      hosts:
        dpu-01:
          ansible_host: 10.68.0.190      # xeon3-oct-112
          ansible_user: dao-test
          ansible_become: true
