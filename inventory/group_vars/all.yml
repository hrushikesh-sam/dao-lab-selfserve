# inventory/group_vars/all.yml — lab-wide values (B-85 bring-up).
#
# The VMs' management network: addresses come from DAOLAB_IP_POOL (10.68.1.0-10.68.2.200) and
# are set statically through cloud-init (playbooks/roles/host_vm). The DPU (10.68.0.190) is on
# the same lab network.
#
# Measured 2026-11-01 on dpu-01 (eth5, DHCP): 10.68.0.190/22, default via 10.68.0.1,
# DNS 8.8.8.8 8.8.4.4.
mgmt_prefix: 22
mgmt_gateway: "10.68.0.1"
mgmt_dns: ["8.8.8.8", "8.8.4.4"]
