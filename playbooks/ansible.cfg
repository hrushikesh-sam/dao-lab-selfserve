# playbooks/ansible.cfg — used by every daolab playbook run (the runner sets ANSIBLE_CONFIG).
[defaults]
inventory = ../inventory/hosts.yml
roles_path = roles:../dao-smartnic/dao_smart_nic_ansible_direct/roles
retry_files_enabled = False
interpreter_python = auto_silent
forks = 10
# B-63: one span per task. The callback only switches itself on when DAOLAB_ANSIBLE_OTEL is
# "true", which runner.ansible_env sets when DAOLAB_OTEL_ENDPOINT is configured, together with
# OTEL_EXPORTER_OTLP_ENDPOINT and TRACEPARENT (the job's span, B-62): every task of a job is
# then a child span of that job in Jaeger. Needs the community.general collection
# (playbooks/requirements.yml) and the OTel SDK + OTLP exporter on the control node.
callbacks_enabled = community.general.opentelemetry

[callback_opentelemetry]
enable_from_environment = DAOLAB_ANSIBLE_OTEL
hide_task_arguments = true

[ssh_connection]
pipelining = True
