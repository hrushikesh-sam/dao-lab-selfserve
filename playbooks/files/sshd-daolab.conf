# /etc/ssh/sshd_config.d/50-daolab.conf — B-52 (plan/09 §7), installed on the DPU.
#
# The shared `lab` login takes its keys from the daolab backend only, asked at every login, so
# access is bounded by the slot even when a cleanup fails. root and the service account are
# not matched: they keep their static authorized_keys (Ansible, break-glass).
Match User lab
    AuthorizedKeysFile none
    AuthorizedKeysCommand /usr/local/bin/daolab-keys %u
    AuthorizedKeysCommandUser daolab-keys
    PasswordAuthentication no
    KbdInteractiveAuthentication no
    PubkeyAuthentication yes

# end the Match block so nothing the main config adds after the include is scoped to it
Match all
