# Give the DPU's 512 MB hugepages back to the baseline. Included by apps/dao-smartnic/cleanup.yml
# and reconcile.yml (the app is stopped by then); verify_clean.yml reports any left above the
# baseline as `dpu_hugepages:<n>`.
#   - SmartNIC's launch reserves six (3 GB); its runbook cleanup never released them.
#   - A DAO app can leave its hugepage-backed file behind (VPP left e_cpt_engine<pid>map_0 on
#     2026-11-14, no process mapping it): a page held by a file cannot be released, so files on
#     the hugetlbfs mount that no process maps are removed first. A file still mapped is kept,
#     its page stays reserved, and the check after cleanup reports it.
# Root comes from the DPU's inventory (`ansible_become: true` on the dpu group).
- name: "step: release_hugepages"
  ansible.builtin.shell: |
    dir={{ daolab_hugetlbfs | default('/dev/hugepages') }}
    for f in "$dir"/*; do
      [ -f "$f" ] || continue
      if grep -qsF "$f" /proc/[0-9]*/maps; then echo "in use: $f"; else rm -f "$f"; echo "removed: $f"; fi
    done
    nr={{ daolab_sysfs | default('/sys') }}/kernel/mm/hugepages/hugepages-{{ daolab_hugepage_kb | default(524288) }}kB/nr_hugepages
    [ -e "$nr" ] || { echo "no $nr"; exit 0; }
    before=$(cat "$nr")
    [ "$before" -le {{ daolab_hugepages_baseline | default(0) | int }} ] && { echo "at baseline: $before"; exit 0; }
    echo {{ daolab_hugepages_baseline | default(0) | int }} > "$nr"
    echo "released: $before -> $(cat "$nr")"
  args:
    executable: /bin/bash
  register: _hugepages
  changed_when: "'released:' in _hugepages.stdout or 'removed:' in _hugepages.stdout"

- name: what was given back
  ansible.builtin.debug:
    var: _hugepages.stdout_lines
