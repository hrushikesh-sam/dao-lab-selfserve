# B-106: the saving steps of end_of_slot.yml, in their own file so a slot that saves
# nothing shows no skipped snapshot_* steps on its job. Any failure here is caught by
# end_of_slot.yml's rescue (the files are then stashed, not lost).
- name: the snapshot is configured for this reservation
  ansible.builtin.assert:
    that:
      - snapshot_public_key | length > 0
      - snapshot_context | length > 0
      - snapshot_path | length > 0
      - snapshot_stage | length > 0
      - snapshot_result_file | length > 0
    fail_msg: >-
      snapshot not configured: needs daolab_snapshot_pubkey, daolab_snapshot_context,
      daolab_snapshot_path, daolab_snapshot_stage and daolab_snapshot_file
    quiet: true

- name: a private work dir on the DPU
  ansible.builtin.file:
    path: "{{ _snap_work }}"
    state: directory
    mode: "0700"

- name: "step: snapshot_state"
  ansible.builtin.script:
    cmd: >-
      capture_state.py --sysfs {{ snapshot_sysfs | quote }}
      --bdfs {{ snapshot_bdfs | to_json | quote }}
    executable: python3
  register: _state
  changed_when: false

- name: write the manifest
  ansible.builtin.copy:
    content: "{{ _state.stdout | from_json | to_nice_json }}\n"
    dest: "{{ _snap_work }}/manifest.json"
    mode: "0600"

# One outer tar: manifest.json + home.tgz (the folder, owners as numbers, links as links).
# Its size is checked here, before anything leaves the DPU.
- name: "step: snapshot_files"
  ansible.builtin.shell: |
    set -euo pipefail
    work={{ _snap_work | quote }}
    tar --one-file-system --numeric-owner --warning=no-file-changed \
        -C {{ snapshot_home | quote }} -czf "$work/home.tgz" .
    tar -tzf "$work/home.tgz" | grep -vc '^\./$' > "$work/count" || true
    tar -C "$work" -cf "$work/snapshot.tar" manifest.json home.tgz
    size=$(stat -c %s "$work/snapshot.tar")
    if [ "$size" -gt {{ snapshot_max_bytes | int }} ]; then
      echo "workspace is $size bytes, over the cap of {{ snapshot_max_bytes | int }} bytes" >&2
      exit 3
    fi
    echo "$size $(cat "$work/count")"
  args:
    executable: /bin/bash
  register: _files
  changed_when: false

- name: bring the archive to the control node
  ansible.builtin.fetch:
    src: "{{ _snap_work }}/snapshot.tar"
    dest: "{{ _snap_staged }}"
    flat: true

- name: the snapshot directory on the control node
  delegate_to: localhost
  become: false
  ansible.builtin.file:
    path: "{{ snapshot_path | dirname }}"
    state: directory
    mode: "0700"

- name: "step: snapshot_seal"
  delegate_to: localhost
  become: false
  ansible.builtin.command:
    argv:
      - "{{ snapshot_python }}"
      - -m
      - service.snapshot
      - seal
      - --in
      - "{{ _snap_staged }}"
      - --out
      - "{{ snapshot_path }}"
      - --public-key
      - "{{ snapshot_public_key }}"
      - --context
      - "{{ snapshot_context }}"
      - --max-bytes
      - "{{ snapshot_max_bytes | int }}"
      - --result-json
      - "{{ _snap_seal_json }}"
  environment:
    PYTHONPATH: "{{ snapshot_repo }}"
  changed_when: true

- name: sealed
  ansible.builtin.set_fact:
    _sealed: true
    _seal: "{{ lookup('ansible.builtin.file', _snap_seal_json) | from_json }}"
