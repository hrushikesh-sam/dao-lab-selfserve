# Empty the lab home folder and put /etc/skel back (policy `wipe`, or `snapshot` once the
# snapshot is sealed or the owner chose not to save). Only called when nothing else needs the
# files: end_of_slot.yml stashes instead when sealing failed.
- name: count what is left
  ansible.builtin.import_tasks: check.yml

- name: "step: wipe_home"
  when: snapshot_home_left | int > 0
  ansible.builtin.shell: |
    set -eu
    home={{ snapshot_home | quote }}
    skel={{ snapshot_skel | quote }}
    owner=$(stat -c %u:%g "$home")
    find "$home" -mindepth 1 -maxdepth 1 -exec rm -rf -- {} +
    if [ -d "$skel" ]; then cp -a "$skel/." "$home/"; fi
    chown -R "$owner" "$home"
    echo "wiped {{ snapshot_home_left }} entries"
  args:
    executable: /bin/bash
  changed_when: true
