# B-106: what cleanup.yml does with the lab home folder, after the owner's access is revoked
# (no process of the login is left, so the files hold still) and BEFORE the app's cleanup
# (which puts the PCI drivers back - the state worth saving would be gone).
#
#   policy wipe                          -> wipe_home
#   policy snapshot, owner said no       -> wipe_home
#   policy snapshot, owner said yes      -> snapshot_state, snapshot_files, snapshot_seal,
#                                           then wipe_home; if any of them fails, stash_home
#                                           (the files are kept, root-only) and the result
#                                           says why. A failed snapshot never fails cleanup.
#
# The seal runs on the control node with the owner's PUBLIC key: no token is needed or
# present. Plaintext exists only in the DPU workdir (tmpfs, 0700) and the job's stage dir on
# the control node, and both are removed in `always:`. The result for the engine (B-108) is
# written to `daolab_snapshot_file` as JSON:
#   {"saved": true, "path", "sha256", "size_bytes", "plain_bytes", "wrapped_dek", "header"}
#   {"saved": false, "error": "<why>"}        or {"saved": false, "skipped": "<why>"}
- name: guard
  ansible.builtin.import_tasks: guard.yml

- name: what this slot asks for
  ansible.builtin.set_fact:
    _snap_wanted: "{{ snapshot_home_policy == 'snapshot' and (snapshot_save | bool) }}"
    _snap_work: "{{ snapshot_workdir }}/r{{ reservation_id | int }}"
    _snap_staged: "{{ snapshot_stage }}/r{{ reservation_id | int }}-snapshot.tar"
    _snap_seal_json: "{{ snapshot_stage }}/r{{ reservation_id | int }}-seal.json"
    _sealed: false
    _snap_error: ""

- name: save the workspace
  when: _snap_wanted | bool
  block:
    - name: seal the folder and the board state
      ansible.builtin.include_tasks: save.yml

  rescue:
    - name: remember why the snapshot failed
      ansible.builtin.set_fact:
        _sealed: false
        _snap_error: >-
          {{ (ansible_failed_task.name | default('snapshot')) ~ ': '
             ~ (((ansible_failed_result.stderr | default('') | trim)
                 or (ansible_failed_result.msg | default('failed')))
                | regex_replace('\s+', ' ') | truncate(300, true, '...')) }}

  always:
    - name: no plaintext left on the DPU
      ansible.builtin.file:
        path: "{{ _snap_work }}"
        state: absent

    - name: no plaintext left on the control node
      delegate_to: localhost
      become: false
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - "{{ _snap_staged }}"
        - "{{ _snap_seal_json }}"
      when: snapshot_stage | length > 0

- name: report the snapshot to the engine
  when: snapshot_home_policy == 'snapshot' and snapshot_result_file | length > 0
  delegate_to: localhost
  become: false
  ansible.builtin.copy:
    dest: "{{ snapshot_result_file }}"
    mode: "0600"
    content: >-
      {{ ({'saved': true, 'path': snapshot_path,
           'header': {'files': (_files.stdout.split() | last | int),
                      'devices': snapshot_bdfs | length,
                      'hugepage_sizes': (_state.stdout | from_json).hugepages | length}}
          | combine(_seal))
         if (_sealed | bool) else
         ({'saved': false, 'error': _snap_error} if (_snap_wanted | bool) else
          {'saved': false, 'skipped': 'the owner chose not to save this workspace'})
         | to_json }}

- name: empty the home folder (saved, or nothing to save)
  ansible.builtin.include_tasks: wipe.yml
  when: not (_snap_wanted | bool) or (_sealed | bool)

- name: keep the files root-only (the snapshot failed)
  ansible.builtin.include_tasks: stash.yml
  when: (_snap_wanted | bool) and not (_sealed | bool)
