# playbooks/roles/snapshot - the shared DPU login's home folder at the end of a slot (P8).
#
# What happens to /home/lab when a reservation ends is the home policy, passed by the runner as
# `daolab_home_policy` (DAOLAB_SNAPSHOTS, B-108):
#
#   keep      (default) nothing: files stay for the next user, as before P8. No task of this
#             role runs, verify_clean.yml does not look at the folder.
#   wipe      the folder goes back to /etc/skel at slot end; leftovers are residue (B-107).
#   snapshot  as wipe, but first the folder and the allowlisted board state are sealed into a
#             snapshot only the owner's token opens (B-106); if sealing fails the folder is
#             moved to the unsaved stash instead of being deleted.
#
# Every path is a variable so the tests (tests/test_snapshot_playbooks.py) run on temp dirs.
# Root comes from the DPU's inventory (`ansible_become: true` on the dpu group), as for
# tasks/release_hugepages.yml.
snapshot_home_policy: "{{ daolab_home_policy | default('keep') }}"
snapshot_login: "{{ hostvars['localhost'].daolab_lab_login | default('lab') }}"
snapshot_home: "{{ daolab_lab_home | default('/home/' ~ snapshot_login) }}"
snapshot_skel: "{{ daolab_skel | default('/etc/skel') }}"
# Root-only (0700) holding area for a home folder that could not be saved or wiped cleanly.
# Never deleted by a playbook; B-111 purges entries older than DAOLAB_UNSAVED_DAYS.
snapshot_unsaved_dir: "{{ daolab_unsaved_dir | default('/var/lib/daolab/unsaved') }}"
# Where the plaintext archive is built on the DPU: a tmpfs, root-only, removed in `always:`.
snapshot_workdir: "{{ daolab_snapshot_workdir | default('/run/daolab') }}"
snapshot_sysfs: "{{ daolab_sysfs | default('/sys') }}"

# ---- snapshot policy only (B-106); the runner passes these per reservation (B-108) ----------
# The owner chose "Save my workspace" (reservations.save_snapshot).
snapshot_save: "{{ daolab_save_snapshot | default(true) | bool }}"
# PCI devices whose driver / SR-IOV state is recorded (setups.snapshot_bdfs). Never the SDP
# RVU PF that the OVS mailbox needs on rvu_af.
snapshot_bdfs: "{{ daolab_snapshot_bdfs | default([]) }}"
# user_keys.public_key of the owner, and the context string the sealed file is bound to
# (models.snapshot_context: "user:<id>|snapshot:<id>").
snapshot_public_key: "{{ daolab_snapshot_pubkey | default('') }}"
snapshot_context: "{{ daolab_snapshot_context | default('') }}"
# On the control node: where the sealed file goes, the job's private staging dir for the
# plaintext archive, and the JSON result the engine reads (B-108).
snapshot_path: "{{ daolab_snapshot_path | default('') }}"
snapshot_stage: "{{ daolab_snapshot_stage | default('') }}"
snapshot_result_file: "{{ daolab_snapshot_file | default('') }}"
# DAOLAB_SNAPSHOT_MAX_MB (512 MB): a bigger workspace is not saved (it is stashed instead).
snapshot_max_bytes: "{{ daolab_snapshot_max_bytes | default(536870912) | int }}"
# The Python that runs `python -m service.snapshot seal` on the control node, and the repo root
# it imports `service` from.
snapshot_python: "{{ daolab_python | default(ansible_playbook_python) }}"
snapshot_repo: "{{ playbook_dir }}/.."
