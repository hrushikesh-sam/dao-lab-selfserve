# One VM, idempotent: an existing VM is never re-created, a running VM is never restarted.
# Re-running after any failure converges (plan/05).
#
# B-93: every call goes through Xen Orchestra's REST API (service/xo.py, `daolab_xo`) from the
# control node; nothing logs in to the dom0. The data-plane VF is a VIF on the host's SR-IOV
# network (`sriov_networks[connect]` in host_vars): on XCP-ng that VIF IS the passthrough, and
# xapi picks a free VF of the PF, so there is no BDF bookkeeping (pciback) any more.
- name: the address leased for {{ vm.role }}
  ansible.builtin.set_fact:
    _ip: "{{ hostvars['localhost'].daolab_ips[vm.role] }}"

- name: does {{ vm.name }} exist
  ansible.builtin.command: "{{ daolab_xo }} vms --pool {{ xo_pool }} --name {{ vm.name }}"
  register: _exists
  changed_when: false

- name: never two VMs with one name
  ansible.builtin.assert:
    that: (_exists.stdout | from_json) | length <= 1
    fail_msg: "more than one VM is named {{ vm.name }} on {{ inventory_hostname }}; destroy the extras (reconcile.yml)"

# Only the passthrough families (plan_vms: e810-vf, sdp -> vf_family) need an SR-IOV network;
# other connections (virtio) are not a VF.
- name: the data-plane network for {{ vm.role }}
  ansible.builtin.set_fact:
    _sriov: "{{ (sriov_networks | default({}))[vm.connect] | default('') if vm.vf_family is not none else '' }}"

- name: the host can wire that connection
  ansible.builtin.assert:
    that: vm.vf_family is none or _sriov | length > 0
    fail_msg: >-
      {{ inventory_hostname }} has no SR-IOV network for role {{ vm.role }} (connect:
      {{ vm.connect }}); add it to sriov_networks in host_vars/{{ inventory_hostname }}.yml
      (plan/05 "One-time dom0 preparation")

- name: the template is in this host's pool
  ansible.builtin.command: "{{ daolab_xo }} template --pool {{ xo_pool }} --name {{ vm.template }}"
  register: _tpl
  changed_when: false
  failed_when: false
  when: (_exists.stdout | from_json) | length == 0

- name: exactly one template of that name
  ansible.builtin.assert:
    that: _tpl.rc == 0
    fail_msg: >-
      template {{ vm.template }} is {{ 'ambiguous on' if _tpl.rc == 4 else 'not on' }}
      {{ inventory_hostname }} (role {{ vm.role }}); build it per plan/05 "Building tpl-ubuntu2204-dao"
      ({{ _tpl.stderr | default('') | trim }})
  when: _tpl is not skipped

- name: "step: create_vm {{ vm.role }}"
  ansible.builtin.command: >-
    {{ daolab_xo }} create --pool {{ xo_pool }} --template {{ vm.template }} --name {{ vm.name }}
    {{ ('--sriov-network ' ~ (_sriov | quote)) if _sriov else '' }}
    --tag daolab --tag daolab-r{{ reservation_id | int }}
  register: _created
  when: (_exists.stdout | from_json) | length == 0

- name: the VM's id and power state
  ansible.builtin.set_fact:
    _uuid: "{{ (_created.stdout | from_json).id if (_created is not skipped) else (_exists.stdout | from_json)[0].id }}"
    _running: "{{ (_created is skipped) and ((_exists.stdout | from_json)[0].power == 'Running') }}"

# ---- first-boot seed (cloud-init NoCloud through xenstore) -----------------------------
# Written whenever the VM is not running (a run that died between create and boot re-seeds);
# a running VM already booted with its seed and is left alone.
- name: every install id is known
  ansible.builtin.assert:
    that: item in host_vm_install_map
    fail_msg: >-
      role {{ vm.role }}: install id '{{ item }}' has no packages in host_vm_install_map
      (playbooks/roles/host_vm/defaults/main.yml)
  loop: "{{ vm.install }}"

# B-95: the use case's httpcheck URLs for this VM, `{<role>_ip}` -> that role's data-plane address
- name: start from {{ vm.role }}'s own httpcheck URLs (not the previous VM's)
  ansible.builtin.set_fact:
    _httpcheck: "{{ vm.httpcheck | default([]) }}"

- name: resolve {{ vm.role }}'s httpcheck URLs
  ansible.builtin.set_fact:
    _httpcheck: "{{ _httpcheck | map('replace', '{' ~ item.key ~ '_ip}', item.value) | list }}"
  loop: "{{ hostvars['localhost'].daolab_role_data_ips | default({}) | dict2items | selectattr('value') | list }}"
  loop_control:
    label: "{{ item.key }}"

- name: every httpcheck URL of {{ vm.role }} is resolved
  ansible.builtin.assert:
    that: (_httpcheck | select('search', '\\{[a-z][a-z0-9_]*_ip\\}') | list) == []
    fail_msg: >-
      role {{ vm.role }}: httpcheck {{ vm.httpcheck }} names a role with no data-plane address
      (vars/dataplane.yml)

- name: the otel agent config for this VM
  ansible.builtin.include_role:
    name: otel_agent
    tasks_from: render
  vars:
    otel_agent_attributes:
      daolab.reservation: "{{ reservation_id | int }}"
      daolab.user: "{{ user }}"
      daolab.role: "{{ vm.role }}"
      daolab.setup: "{{ setup }}"
      host: "{{ vm.name }}"
    otel_agent_httpcheck: "{{ _httpcheck }}"   # B-95: the role's httpcheck URLs

- name: render the seed
  ansible.builtin.set_fact:
    _seed:
      user-data: "{{ lookup('ansible.builtin.template', 'user-data.j2') | b64encode }}"
      network-config: "{{ lookup('ansible.builtin.template', 'network-config.j2') | b64encode }}"
      meta-data: "{{ ('instance-id: ' ~ vm.name ~ '-' ~ _ip ~ '\nlocal-hostname: ' ~ vm.name ~ '\n') | b64encode }}"
      # daolab_otel_collector, not otel_agent_collector: that is a default of the otel_agent role
      # and is not visible here, so the VMs never got an agent config (B-95)
      otel: "{{ (otel_agent_config_text if (daolab_otel_collector | default('') | length > 0) else '') | b64encode }}"

- name: every seed key fits in xenstore (4 KiB per value)
  ansible.builtin.assert:
    that: item.value | length < 3800
    fail_msg: "vm-data/daolab/{{ item.key }} is {{ item.value | length }} bytes; xenstore takes < 4096"
  loop: "{{ _seed | dict2items }}"
  loop_control:
    label: "{{ item.key }}"

- name: "step: seed {{ vm.role }}"
  when: not _running
  no_log: "{{ daolab_no_log | default(true) }}"
  block:
    - name: a private file for the seed (it holds the owner's login; never on a command line)
      ansible.builtin.tempfile:
        suffix: .daolab-seed.json
      register: _seedfile

    - name: write the seed
      ansible.builtin.copy:
        content: >-
          {{ {'vm-data/ip': _ip,
              'vm-data/daolab/user-data': _seed['user-data'],
              'vm-data/daolab/network-config': _seed['network-config'],
              'vm-data/daolab/meta-data': _seed['meta-data'],
              'vm-data/daolab/otel': _seed['otel']} | to_json }}
        dest: "{{ _seedfile.path }}"
        mode: "0600"

    - name: hand it to the VM
      ansible.builtin.command: "{{ daolab_xo }} seed --vm {{ _uuid }} --file {{ _seedfile.path }}"

  always:
    - name: drop the seed file
      ansible.builtin.file:
        path: "{{ _seedfile.path }}"
        state: absent
      when: _seedfile.path is defined

# ---- boot and wait for the leased address -------------------------------------------------
- name: "step: start_vm {{ vm.role }}"
  ansible.builtin.command: "{{ daolab_xo }} start --vm {{ _uuid }}"
  when: not _running

- name: "step: wait_ip {{ vm.role }}"
  ansible.builtin.command: "{{ daolab_xo }} ip --vm {{ _uuid }}"
  register: _guest_ip
  until: _guest_ip.rc == 0 and (_guest_ip.stdout | trim) == _ip
  retries: "{{ host_vm_ip_retries }}"
  delay: "{{ host_vm_ip_delay }}"
  changed_when: false
  failed_when: _guest_ip.rc not in [0, 1]          # 1 = no address yet; judged just below

- name: the guest came up on its leased address
  ansible.builtin.assert:
    that: _guest_ip.rc == 0 and (_guest_ip.stdout | trim) == _ip
    fail_msg: >-
      {{ vm.name }} reports '{{ _guest_ip.stdout | trim }}' after the wait, not its leased {{ _ip }}:
      {{ 'no address at all (guest tools?)' if _guest_ip.rc != 0 else
         'the template did not apply the first-boot seed (is daolab-seed baked into ' ~ vm.template ~ '? plan/05)' }}

- name: "step: post_vm_ip {{ vm.role }}"
  ansible.builtin.uri:
    url: "{{ daolab_api_url }}/internal/vm-ip"
    method: POST
    headers:
      X-Daolab-Secret: "{{ daolab_internal_secret }}"
    body_format: json
    body: {reservation_id: "{{ reservation_id | int }}", role: "{{ vm.role }}", ip: "{{ _ip }}"}
  delegate_to: localhost
  when: reservation_id | int != 0
  no_log: "{{ daolab_no_log | default(true) }}"
