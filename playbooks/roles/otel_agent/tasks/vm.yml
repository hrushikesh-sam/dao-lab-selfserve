# B-86: the agent on a role VM. host_vm already handed the VM its config through the seed
# (render.yml -> daolab-seed -> {{ otel_agent_config }}); the template has no otelcol-contrib and
# no unit, so the first-boot `systemctl enable --now daolab-otel` found nothing to start.
# This installs both and starts the agent on the config the seed wrote. Run as the service login.
- name: the agent needs a collector
  ansible.builtin.meta: end_role
  when: otel_agent_collector | length == 0

- name: the seed wrote the agent config
  ansible.builtin.stat:
    path: "{{ otel_agent_config }}"
  register: _otel_cfg

- name: no config, no agent
  ansible.builtin.assert:
    that: _otel_cfg.stat.exists
    fail_msg: >-
      {{ otel_agent_config }} is missing on {{ inventory_hostname }}: daolab-seed did not write
      vm-data/daolab/otel (is daolab-seed baked into the template? plan/05)

- name: the binary
  ansible.builtin.include_tasks: binary.yml

- name: install the unit
  ansible.builtin.template:
    src: daolab-otel.service.j2
    dest: "{{ otel_agent_unit_dir }}/{{ otel_agent_unit }}.service"
    mode: "0644"
  register: _otel_unit
  notify: restart the agent

- name: reload systemd
  ansible.builtin.command: systemctl daemon-reload
  when: _otel_unit.changed
  changed_when: true

- name: "step: otel_agent_vm"
  ansible.builtin.command: systemctl enable --now {{ otel_agent_unit }}
  register: _otel_enable
  changed_when: "'Created symlink' in _otel_enable.stderr"
