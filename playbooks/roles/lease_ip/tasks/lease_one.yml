# One VM role: lease, then make sure nothing else answers on the address before using it.
- name: "step: lease_ip {{ vm.role }}"
  ansible.builtin.uri:
    url: "{{ daolab_api_url }}/internal/leases"
    method: POST
    headers:
      X-Daolab-Secret: "{{ daolab_internal_secret }}"
    body_format: json
    body: {reservation_id: "{{ reservation_id | int }}", role: "{{ vm.role }}"}
  register: _lease
  no_log: "{{ daolab_no_log | default(true) }}"

- name: remember the address
  ansible.builtin.set_fact:
    _ip: "{{ _lease.json.ip }}"

# A replay finds its own VM already up on the address: that is not a conflict.
- name: is this reservation's VM already there (Xen Orchestra, B-93)
  ansible.builtin.command: "{{ daolab_xo }} vms --pool {{ hostvars[vm.host].xo_pool }} --name {{ vm.name }}"
  register: _ours
  changed_when: false

# B-97: ARP, not ICMP (a host that drops ping still answers ARP). ARP only reaches the local
# segment, so it runs on the VM's dom0, which sits on the management /22 (mgmt_bridge); the
# control node may not. iputils arping: rc 0 = something replied, 1 = silence; anything else
# (ssh 255, a bad interface 2) fails the step instead of passing as "free".
- name: does anything else answer ARP for {{ _ip }}
  ansible.builtin.command: >-
    {{ daolab_dom0_ssh }} {{ hostvars[vm.host].ansible_host }}
    arping -c 2 -w 3 -I {{ hostvars[vm.host].mgmt_bridge }} {{ _ip }}
  register: _ping
  changed_when: false
  failed_when: _ping.rc not in [0, 1]
  when: (_ours.stdout | from_json) | length == 0

- name: "step: lease_conflict {{ vm.role }}"
  when: _ping.rc | default(1) == 0
  block:
    - name: swap the address (it is quarantined, never issued again)
      ansible.builtin.uri:
        url: "{{ daolab_api_url }}/internal/leases/conflict"
        method: POST
        headers:
          X-Daolab-Secret: "{{ daolab_internal_secret }}"
        body_format: json
        body: {ip: "{{ _ip }}"}
      register: _swap
      no_log: "{{ daolab_no_log | default(true) }}"

    - name: take the replacement
      ansible.builtin.set_fact:
        _ip: "{{ _swap.json.ip }}"

    - name: the replacement must be silent too
      ansible.builtin.command: >-
        {{ daolab_dom0_ssh }} {{ hostvars[vm.host].ansible_host }}
        arping -c 2 -w 3 -I {{ hostvars[vm.host].mgmt_bridge }} {{ _ip }}
      register: _ping2
      changed_when: false
      failed_when: _ping2.rc != 1

- name: record it
  ansible.builtin.set_fact:
    daolab_ips: "{{ (daolab_ips | default({})) | combine({vm.role: _ip}) }}"
