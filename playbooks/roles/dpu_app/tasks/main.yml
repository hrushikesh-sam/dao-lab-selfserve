- name: the use case's DPU app
  ansible.builtin.set_fact:
    _spec: "{{ hostvars['localhost'].daolab_roles[hostvars['localhost'].daolab_dpu_role] }}"
    _dp: "{{ hostvars['localhost'].daolab_dataplane[usecase] | default({}) }}"

- name: there is a role for it
  ansible.builtin.assert:
    that: _spec.app in dpu_app_roles
    fail_msg: >-
      no playbook role runs DPU app '{{ _spec.app }}': add playbooks/roles/<role> and map it in
      playbooks/roles/dpu_app/defaults/main.yml

- name: one app at a time on the DPU - stop any other use case's
  ansible.builtin.shell: |
    others=$(systemctl list-units 'daolab-app-*' --state=active --plain --no-legend \
             | awk '{print $1}' | grep -vx 'daolab-app-{{ _spec.app }}.service' || true)
    [ -z "$others" ] && exit 0
    systemctl stop $others
    echo "stopped: $others"
  register: _others
  changed_when: "'stopped:' in _others.stdout"

- name: "step: dpu_app"
  ansible.builtin.include_role:
    name: "{{ dpu_app_roles[_spec.app] }}"
  vars:
    dpu_app_spec: "{{ _spec }}"
    dpu_app_unit: "daolab-app-{{ _spec.app }}"
    dpu_app_addresses: "{{ _dp[hostvars['localhost'].daolab_dpu_role] | default({}) }}"
    dpu_app_upstream_ip: >-
      {{ (_dp[_spec.upstream] | default('')).split('/')[0] if _spec.upstream is defined else '' }}

- name: the app is running
  ansible.builtin.command: systemctl is-active daolab-app-{{ _spec.app }}.service
  changed_when: false
