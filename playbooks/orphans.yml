# playbooks/orphans.yml — B-73: the orphan sweep's two halves, on every XCP-ng host.
#
# The engine sweeps every tick (plan/09 §9): it lists the daolab-tagged VMs, decides in the DB
# which ones belong to no live reservation, and destroys exactly those. An orphan's setup may
# be unknown (a VM made by hand as daolab-r999-x), so this runs over the whole `xcp_hosts`
# inventory group rather than one resolved setup.
#
#   without daolab_vm_ids_file: write every daolab-r<id>-* VM as {"id", "name"} (JSON list) to
#                               {{ daolab_output_file }} on the control node
#   with daolab_vm_ids_file:    hard-shutdown + delete each listed VM whose Xen Orchestra id is in
#                               that file (a JSON list of XO VM ids, written 0600 by the runner)
#
# P-0d (EXTRAVAR-MATRIX row 25): destroying is by XO VM id, never by name, and the ids come from a
# file read with lookup(): lookup results are data and are never templated, so nothing the caller
# hands over is evaluated. Only ids of the strict XO shape (daolab_vm_id_re) are used, and only
# ids of VMs listed right now: an id that is not there is a no-op, and a VM re-made under the same
# name has a new id and stays. Read-only in list mode.
- name: orphan sweep on the XCP-ng hosts (through Xen Orchestra, B-93)
  hosts: xcp_hosts
  gather_facts: false
  tasks:
    - name: "step: list_vms"
      ansible.builtin.command: "{{ daolab_xo }} vms --pool {{ xo_pool }} --prefix daolab-r"
      register: _listed
      changed_when: false

    - name: keep the daolab-r<id>-* VMs (their XO id and name only)
      ansible.builtin.set_fact:
        _tagged:
          rows: >-
            {{ _listed.stdout | from_json | selectattr('name', 'match', '^daolab-r[0-9]+-')
               | map('dict2items') | map('selectattr', 'key', 'in', ['id', 'name']) | map('list')
               | map('items2dict') | list }}

    - name: read the XO ids to destroy (data, never templated)
      ansible.builtin.set_fact:
        _ids: >-
          {{ lookup('ansible.builtin.file', daolab_vm_ids_file) | from_json
             | select('string') | select('match', daolab_vm_id_re) | list }}
      when: daolab_vm_ids_file is defined

    - name: "step: destroy_vms"
      ansible.builtin.command: "{{ daolab_xo }} destroy --vm {{ item.id }}"
      loop: >-
        {{ _listed.stdout | from_json | selectattr('name', 'match', '^daolab-r[0-9]+-')
           | selectattr('id', 'string') | selectattr('id', 'match', daolab_vm_id_re)
           | selectattr('id', 'in', _ids) | list }}
      loop_control:
        label: "{{ item.id }}"
      when: daolab_vm_ids_file is defined
      changed_when: true

- name: report
  hosts: localhost
  gather_facts: false
  tasks:
    - name: write the tagged VMs (XO id + name) for the runner
      ansible.builtin.copy:
        content: >-
          {{ groups['xcp_hosts'] | map('extract', hostvars, ['_tagged', 'rows'])
             | flatten | select | unique | list | to_json }}
        dest: "{{ daolab_output_file }}"
        mode: "0600"
      when: daolab_output_file is defined and daolab_vm_ids_file is not defined
