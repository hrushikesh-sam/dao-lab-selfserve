# playbooks/reconcile.yml — B-72: destroy what a cleanup or an interrupted deploy left behind
# (plan/09 §9, the "reconcile" box). Unlike cleanup.yml it does not trust Ansible facts or the
# use case: it acts directly on what verify_clean.yml finds.
#
#   1. on each dom0, through Xen Orchestra (B-93): every VM named daolab-r<id>-* -> hard
#      shutdown + delete (the VM, its VIFs and VDIs; its SR-IOV VF goes back to the PF);
#   2. on the DPU: the app's runbook cleanup again (apps/<app>/cleanup.yml), then every
#      daolab-app-* unit stopped (hw_class untouched, plan/01 invariant);
#   3. on the DPU: every session / process of the shared lab login killed.
#
# Every step is idempotent and safe on a clean testbed. Followed by verify_clean.yml.
# Extra vars: reservation_id, setup (+ what play 0 reads). `daolab_vm_names` (a list of VM
# names) replaces step 1's name match: the orphan sweep (B-73) passes the orphans it found.
- name: resolve the setup
  hosts: localhost
  gather_facts: false
  tasks:
    - name: resolve
      ansible.builtin.import_tasks: tasks/resolve.yml

- name: reconcile the XCP-ng hosts (through Xen Orchestra, B-93)
  hosts: r_dom0
  gather_facts: false
  tasks:
    - name: list the daolab VMs on the host
      ansible.builtin.command: "{{ daolab_xo }} vms --pool {{ xo_pool }} --prefix daolab-r"
      register: _all_vms
      changed_when: false

    - name: pick the VMs to destroy
      ansible.builtin.set_fact:
        _doomed: >-
          {{ (_all_vms.stdout | from_json | selectattr('name', 'in', daolab_vm_names) | list)
             if daolab_vm_names is defined else
             (_all_vms.stdout | from_json
              | selectattr('name', 'match', '^daolab-r' ~ (reservation_id | int) ~ '-') | list) }}

    - name: "step: destroy_vms"
      ansible.builtin.command: "{{ daolab_xo }} destroy --vm {{ item.id }}"
      loop: "{{ _doomed }}"
      loop_control:
        label: "{{ item.name }}"
      changed_when: true

- name: the DAO app's own cleanup, again (VPP / SmartNIC give their devices back)
  ansible.builtin.import_playbook: "apps/{{ daolab_app | default('none') }}/cleanup.yml"

- name: reconcile the DPU
  hosts: r_dpu
  gather_facts: false
  tasks:
    - name: "step: stop_app"
      ansible.builtin.shell: |
        units=$(systemctl list-units 'daolab-app-*' --state=active --plain --no-legend | awk '{print $1}')
        [ -z "$units" ] && exit 0
        systemctl stop $units
        echo "stopped: $units"
      register: _stop
      changed_when: "'stopped:' in _stop.stdout"

    - name: "step: kill_sessions"
      ansible.builtin.shell: |
        login={{ hostvars['localhost'].daolab_lab_login }}
        if pgrep -u "$login" -c >/dev/null; then
          loginctl terminate-user "$login" 2>/dev/null || true
          pkill -KILL -u "$login" || true
          echo killed
        fi
      register: _kill
      changed_when: "'killed' in _kill.stdout"
