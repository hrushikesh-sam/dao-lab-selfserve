# playbooks/deploy.yml — B-80: one click -> one playbook (plan/09 §6). The four playbooks of
# plan/05 became roles here, so the dashboard sees exactly one job.
#
#   play 0  localhost  resolve the setup, plan the VMs, lease their addresses (lease_ip)
#   play 1  the DPU    ebf_set (stub) -> dpu_app (B-81 roles) -> otel_agent -> post its IP
#   play 2  dom0s      host_vm: clone, cloud-init seed, VIF, VF, boot, wait, post VM IPs
#   play 3  localhost  verify: the use case's YAML verify block, from its `from` VM
#
# Idempotent: a second run is all ok / skipped, so the engine's retry is "run it again".
# Diy reservations only get their bare VMs (no DPU app, no verify).
#
# Extra vars (runner, B-84): reservation_id, usecase, setup, user, ssh_pubkey, hw_class, diy,
# templates, daolab_members / daolab_roles / daolab_verify / daolab_vms, daolab_api_url,
# daolab_internal_secret, daolab_otel_collector. Manual run: reservation_id=0 + manual_ips.
- name: resolve, plan and lease
  hosts: localhost
  gather_facts: false
  tasks:
    - name: resolve
      ansible.builtin.import_tasks: tasks/resolve.yml
    - name: plan
      ansible.builtin.import_tasks: tasks/plan_vms.yml
    - name: "step: lease_ips"
      ansible.builtin.include_role:
        name: lease_ip

- name: prepare the DPU
  hosts: r_dpu
  gather_facts: false
  tasks:
    - name: the use case's app on the DPU
      when: not (diy | default(false) | bool) and hostvars['localhost'].daolab_dpu_role | length > 0
      block:
        - name: personality
          ansible.builtin.include_role:
            name: ebf_set
          vars:
            ebf_target_hw_class: "{{ hw_class }}"
          when: hw_class | default('', true) | length > 0

        - name: app
          ansible.builtin.include_role:
            name: dpu_app

        - name: telemetry
          ansible.builtin.include_role:
            name: otel_agent
          vars:
            otel_agent_attributes:
              daolab.reservation: "{{ reservation_id | int }}"
              daolab.user: "{{ user }}"
              daolab.role: "{{ hostvars['localhost'].daolab_dpu_role }}"
              daolab.setup: "{{ setup }}"
              host: "{{ inventory_hostname }}"
            otel_agent_scrape_targets: "{{ dpu_app_scrape_targets | default([]) }}"

        - name: "step: post_dpu_ip"
          ansible.builtin.uri:
            url: "{{ daolab_api_url }}/internal/vm-ip"
            method: POST
            headers:
              X-Daolab-Secret: "{{ daolab_internal_secret }}"
            body_format: json
            body:
              reservation_id: "{{ reservation_id | int }}"
              role: "{{ hostvars['localhost'].daolab_dpu_role }}"
              ip: "{{ hostvars['localhost'].daolab_dpu_ip }}"
          delegate_to: localhost
          when: reservation_id | int != 0
          no_log: "{{ daolab_no_log | default(true) }}"

- name: create the VMs
  hosts: r_dom0
  gather_facts: false
  tasks:
    - name: host_vm
      ansible.builtin.include_role:
        name: host_vm

- name: verify
  hosts: localhost
  gather_facts: false
  tasks:
    - name: verify
      ansible.builtin.include_role:
        name: verify
