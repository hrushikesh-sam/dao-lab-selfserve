# playbooks/verify_clean.yml — B-70: prove a reservation left nothing behind (plan/09 §9).
#
# Read-only: every check is a direct query, never an Ansible "changed" result. The outcome is
# a residue list, one "kind:ident" string per item (service/runner.py RESIDUE_KINDS), written
# as JSON to {{ daolab_output_file }} on the control node; an empty list means clean.
#
#   vm:<name>        an XCP-ng VM named daolab-r<id>-* still exists
#   dpu_session:lab  processes of the shared DPU login are still running
#   dpu_app:<unit>   a use-case app unit (daolab-app-*.service) is still active on the DPU,
#   dpu_app:<proc>   or an app process the runbooks start by hand (vpp, dao-smart-nic) runs
#   dpu_app:ml-tvm   ml-tvm left something: its saved state, a process holding the ML device,
#                    or ML DPDK files (/var/run/dpdk/<prefix>*, <prefix>*map_* hugepage files)
#   dpu_home:<login> the shared login's home folder holds more than /etc/skel (B-107) - only
#                    checked when the home policy is not `keep` (roles/snapshot/defaults)
#   ip:<address>     an address leased to the reservation still answers ping
#
# A host that cannot be reached fails the run (rc != 0), so the runner reports "could not
# verify" and the engine treats the setup as not clean: verification is fail-safe.
#
# Extra vars: reservation_id, setup, daolab_output_file, plus what play 0 reads
# (playbooks/tasks/resolve.yml). Step names (`step: ...`) become job steps (B-84).
- name: resolve the setup
  hosts: localhost
  gather_facts: false
  tasks:
    - name: resolve
      ansible.builtin.import_tasks: tasks/resolve.yml

- name: check the XCP-ng hosts (through Xen Orchestra, B-93)
  hosts: r_dom0
  gather_facts: false
  tasks:
    - name: "step: check_vms"
      ansible.builtin.command: "{{ daolab_xo }} vms --pool {{ xo_pool }} --prefix daolab-r{{ reservation_id | int }}-"
      register: _vms
      changed_when: false

    # A VF is a VIF on the SR-IOV network: it goes back to the PF with its VM, so a leftover VF
    # always shows up as a leftover VM above (no pciback bookkeeping since B-93).
    - name: collect this host's residue
      ansible.builtin.set_fact:
        daolab_residue: "{{ _vms.stdout | from_json | map(attribute='name') | map('regex_replace', '^', 'vm:') | list }}"

- name: check the DPU
  hosts: r_dpu
  gather_facts: false
  tasks:
    - name: "step: check_sessions"
      ansible.builtin.shell: pgrep -u {{ hostvars['localhost'].daolab_lab_login }} -c || true
      register: _sessions
      changed_when: false

    - name: list active use-case app units
      ansible.builtin.shell: |
        systemctl list-units 'daolab-app-*' --state=active --plain --no-legend | awk '{print $1}'
      register: _apps
      changed_when: false

    - name: list the DAO app processes the runbooks start by hand (VPP, SmartNIC)
      ansible.builtin.shell: |
        {% for name, pattern in (daolab_app_processes | default({'vpp': 'vpp|vpp_main', 'dao-smart-nic': 'dao-smart-nic'})).items() %}
        pgrep -x '{{ pattern }}' >/dev/null && echo '{{ name }}'
        {% endfor %}
        true
      register: _procs
      changed_when: false

    - name: count the 512 MB hugepages still reserved
      ansible.builtin.shell: >-
        cat {{ daolab_sysfs | default('/sys') }}/kernel/mm/hugepages/hugepages-{{ daolab_hugepage_kb | default(524288) }}kB/nr_hugepages
        2>/dev/null || echo 0
      register: _huge
      changed_when: false

    - name: what ml-tvm left behind (saved state, ML device holders, ML DPDK files)
      become: true
      ansible.builtin.shell: |
        left=""
        [ -e {{ ml_state_dir | default('/var/lib/daolab/ml') }}/state.json ] && left="$left state"
        g=$(readlink {{ daolab_sysfs | default('/sys') }}/bus/pci/devices/{{ ml_pci | default('0000:00:10.0') }}/iommu_group 2>/dev/null); g=${g##*/}
        if [ -n "$g" ]; then
          for fd in /proc/[0-9]*/fd/*; do
            [ "$(readlink "$fd" 2>/dev/null)" = "/dev/vfio/$g" ] && { left="$left holder"; break; }
          done
        fi
        p={{ ml_file_prefix | default('ml') }}
        ls -d /var/run/dpdk/$p /var/run/dpdk/$p-* >/dev/null 2>&1 && left="$left runtime"
        [ -n "$(find /dev/hugepages /mnt/huge -maxdepth 1 -name "${p}*map_*" 2>/dev/null)" ] && left="$left hugepages"
        [ -n "$left" ] && echo "ml-tvm" || true
      register: _ml_left
      changed_when: false

    # B-107: an include, not a task with `when`, so with the default policy `keep` no
    # `check_home` step shows on the job at all.
    - name: the lab home folder (B-107)
      ansible.builtin.include_role:
        name: snapshot
        tasks_from: check
      when: (daolab_home_policy | default('keep')) != 'keep'

    - name: collect this host's residue
      ansible.builtin.set_fact:
        daolab_residue: >-
          {{ (['dpu_session:' ~ hostvars['localhost'].daolab_lab_login]
              if (_sessions.stdout | trim | int(0)) > 0 else [])
             + (_apps.stdout_lines | select | map('regex_replace', '^', 'dpu_app:') | list)
             + (_procs.stdout_lines | select | map('regex_replace', '^', 'dpu_app:') | list)
             + (['dpu_hugepages:' ~ (_huge.stdout | trim)]
                if (_huge.stdout | trim | int(0)) > (daolab_hugepages_baseline | default(2) | int) else [])
             + (_ml_left.stdout_lines | select | map('regex_replace', '^', 'dpu_app:') | list)
             + (['dpu_home:' ~ hostvars['localhost'].daolab_lab_login]
                if (snapshot_home_left | default(0) | int) > 0 else []) }}

- name: check the leased addresses are silent
  hosts: r_dom0[0]
  gather_facts: false
  tasks:
    - name: "step: check_ips"
      ansible.builtin.command: ping -c 2 -W 1 {{ item }}
      loop: "{{ hostvars['localhost'].daolab_leases }}"
      register: _pings
      changed_when: false
      failed_when: false

    - name: collect the addresses that answered
      ansible.builtin.set_fact:
        daolab_ip_residue: >-
          {{ _pings.results | selectattr('rc', 'equalto', 0) | map(attribute='item')
             | map('regex_replace', '^', 'ip:') | list }}

- name: report
  hosts: localhost
  gather_facts: false
  tasks:
    - name: gather every host's residue
      ansible.builtin.set_fact:
        _residue: >-
          {{ (_residue | default([])) + (hostvars[item].daolab_residue | default([]))
             + (hostvars[item].daolab_ip_residue | default([])) }}
      loop: "{{ (groups['r_dom0'] | default([])) + (groups['r_dpu'] | default([])) }}"

    - name: write the residue list for the runner
      ansible.builtin.copy:
        content: "{{ (_residue | default([])) | to_json }}"
        dest: "{{ daolab_output_file }}"
        mode: "0600"
      when: daolab_output_file is defined

    - name: show the residue
      ansible.builtin.debug:
        msg: "{{ _residue | default([]) if (_residue | default([])) else 'clean' }}"
