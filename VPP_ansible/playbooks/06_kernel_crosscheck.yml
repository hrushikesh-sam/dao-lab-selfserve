---
- name: Step 9 - Cross-check no-carrier port with Linux driver
  hosts: dpu
  gather_facts: false

  tasks:
    - name: Stop VPP
      become: true
      shell: "pkill vpp || true"
      changed_when: true

    - name: Wait for VPP to stop
      pause:
        seconds: 2

    - name: Confirm VPP stopped
      shell: "pgrep -a vpp || true"
      register: vpp_stopped
      changed_when: false

    - name: Check rvu_nicpf and current driver override
      shell: |
        ls -d /sys/bus/pci/drivers/rvu_nicpf
        cat /sys/bus/pci/devices/{{ pci_no_carrier }}/driver_override
      register: kernel_driver_check
      changed_when: false

    - name: Check current driver for no-carrier device
      become: true
      shell: |
        basename "$(readlink /sys/bus/pci/devices/{{ pci_no_carrier }}/driver)"
      register: no_carrier_current_driver
      changed_when: false

    - name: Unbind no-carrier device from vfio-pci
      become: true
      shell: "echo {{ pci_no_carrier }} | tee /sys/bus/pci/drivers/vfio-pci/unbind"
      when: no_carrier_current_driver.stdout == "vfio-pci"
      changed_when: true

    - name: Clear no-carrier driver override
      become: true
      shell: "echo | tee /sys/bus/pci/devices/{{ pci_no_carrier }}/driver_override"
      when: no_carrier_current_driver.stdout == "vfio-pci"
      changed_when: true

    - name: Bind no-carrier device to rvu_nicpf
      become: true
      shell: "echo {{ pci_no_carrier }} | tee /sys/bus/pci/drivers/rvu_nicpf/bind"
      when: no_carrier_current_driver.stdout != "rvu_nicpf"
      changed_when: true

    - name: Wait for kernel network interface
      pause:
        seconds: 2

    - name: Find no-carrier network interface
      shell: "ls /sys/class/net | grep enP2p2s0"
      register: no_carrier_interface
      changed_when: false

    - name: Bring no-carrier interface up
      become: true
      shell: "ip link set enP2p2s0 up"
      changed_when: true

    - name: Wait for carrier state
      pause:
        seconds: 5

    - name: Check no-carrier operstate and carrier
      shell: |
        cat /sys/class/net/enP2p2s0/operstate
        cat /sys/class/net/enP2p2s0/carrier
      register: no_carrier_link_state
      changed_when: false

    - name: Check kernel messages
      become: true
      shell: "dmesg | tail -6"
      register: kernel_messages
      changed_when: false

    - name: Count application processes
      shell: "ps -eo pid,args | grep -E 'smart-nic|secgw|nginx' | grep -v grep | wc -l"
      register: app_count
      changed_when: false

    - name: Check no-carrier port with ethtool
      become: true
      shell: "ethtool enP2p2s0 | grep -E 'Supported ports|Supported link modes|Speed|Duplex|Port|Link detected'"
      register: ethtool_no_carrier
      changed_when: false

    - name: Check no-carrier driver
      become: true
      shell: "ethtool -i enP2p2s0 | grep -E 'driver|bus-info'"
      register: ethtool_driver
      changed_when: false

    - name: Check live port with ethtool
      become: true
      shell: |
        if ip link show "{{ data_interface_live }}" >/dev/null 2>&1; then
          ethtool "{{ data_interface_live }}" | grep -E 'Supported ports|Speed|Duplex|Port|Link detected'
        else
          echo "{{ data_interface_live }} is not present because {{ pci_live_port }} is currently bound to vfio-pci"
        fi
      register: ethtool_live
      changed_when: false

    - name: Show VPP stopped state
      debug:
        var: vpp_stopped.stdout_lines

    - name: Show kernel driver check
      debug:
        var: kernel_driver_check.stdout_lines

    - name: Show no-carrier interface
      debug:
        var: no_carrier_interface.stdout_lines

    - name: Show no-carrier link state
      debug:
        var: no_carrier_link_state.stdout_lines

    - name: Show kernel messages
      debug:
        var: kernel_messages.stdout_lines

    - name: Show application process count
      debug:
        var: app_count.stdout_lines

    - name: Show no-carrier ethtool
      debug:
        var: ethtool_no_carrier.stdout_lines

    - name: Show no-carrier driver
      debug:
        var: ethtool_driver.stdout_lines

    - name: Show live-port ethtool result
      debug:
        var: ethtool_live.stdout_lines