[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "daolab"
version = "0.1.0"
description = "DAO use-case reservation system for DPU/TG lab setups"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "PyYAML>=6.0",
    "python-dotenv>=1.0",
    "pytest>=8.0",
    "httpx>=0.27",
    "opentelemetry-sdk>=1.20",
    "opentelemetry-exporter-otlp-proto-grpc>=1.20",
    "opentelemetry-instrumentation-fastapi>=0.41b0",
]

[project.scripts]
daolab = "service.cli:main"

[tool.setuptools]
packages = ["service"]
