[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "daolab"
version = "0.1.0"
description = "DAO use-case reservation system for DPU/TG lab setups"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "PyYAML>=6.0",
    "python-dotenv>=1.0",
    "pytest>=8.0",
    "httpx>=0.27",
    "opentelemetry-sdk>=1.20",
    "opentelemetry-exporter-otlp-proto-grpc>=1.20",
    "opentelemetry-instrumentation-fastapi>=0.41b0",
]

[project.optional-dependencies]
# The real runner (B-84) and the playbook tests (tests/test_playbooks.py); not needed for
# DAOLAB_RUNNER=mock or the rest of the test suite.
# The floor is 2.20, the design floor (F-5-3): P-0d's lookup canary
# (tests/test_orphans_canary.py) was proven on ansible-core 2.20.11 and 2.21.6 only.
# Independently, playbooks/roles/otel_agent uses `meta: end_role` (ansible-core 2.18+);
# anything older than that aborts the role. tests/test_platform_floor.py pins this line.
ansible = [
    "ansible-core>=2.20",
    "ansible-runner>=2.3",
]

[project.scripts]
daolab = "service.cli:main"

[tool.setuptools]
packages = ["service"]
